<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0e">
  <meta name="description" content="Ваш капитал, активы, накопления и доходы в одном месте.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Капитал">
  <title>Капитал</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon.png">
  <link rel="icon" href="./icon.png" type="image/png">
  <link rel="stylesheet" href="./style.css">
  <script src="./core.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <aside>
    <nav aria-label="Основная навигация"></nav>
    <div class="local">● Данные на этом устройстве</div>
  </aside>
  <main>
    <header><div><h1>Главная</h1></div><button class="primary" id="add" type="button">＋ Добавить</button></header>
    <div id="content"></div>
  </main>
  <dialog id="editor" aria-labelledby="dialog-title">
    <form id="form">
      <div class="dialog-head"><h2 id="dialog-title"></h2><button type="button" class="icon" id="close" aria-label="Закрыть">×</button></div>
      <div id="fields"></div><p id="error" role="alert"></p>
      <button class="primary wide" id="save" type="submit">Сохранить</button>
    </form>
  </dialog>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <noscript>Для работы приложения включите JavaScript в браузере.</noscript>
</body>
</html>
